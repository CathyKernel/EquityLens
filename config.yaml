# =============================================================================
# Equity Quant ML - Pipeline Configuration
# =============================================================================
# Central configuration for the entire pipeline: universe definition, data
# window, feature parameters, model hyperparameters and backtest settings.

# --- Investment universe -----------------------------------------------------
universe:
  # 21 large-cap S&P 500 constituents spanning 8 GICS sectors (plus benchmark)
  tickers:
    # Technology
    - AAPL    # Apple Inc.
    - MSFT    # Microsoft Corp.
    - NVDA    # NVIDIA Corp.
    - INTC    # Intel Corp.
    # Communication Services
    - GOOGL   # Alphabet Inc. Class A
    - META    # Meta Platforms Inc.
    - NFLX    # Netflix Inc.
    # Consumer Discretionary
    - AMZN    # Amazon.com Inc.
    - TSLA    # Tesla Inc.
    # Consumer Staples
    - WMT     # Walmart Inc.
    - KO      # Coca-Cola Co.
    - PG      # Procter & Gamble Co.
    # Financials
    - JPM     # JPMorgan Chase & Co.
    - BAC     # Bank of America Corp.
    - GS      # Goldman Sachs Group Inc.
    # Health Care
    - JNJ     # Johnson & Johnson
    - UNH     # UnitedHealth Group Inc.
    - PFE     # Pfizer Inc.
    # Energy
    - XOM     # Exxon Mobil Corp.
    - CVX     # Chevron Corp.
    # Industrials
    - CAT     # Caterpillar Inc.
  benchmark: SPY

# Ticker -> GICS sector mapping (used for sector-level SQL aggregation)
sector_map:
  AAPL: Technology
  MSFT: Technology
  NVDA: Technology
  INTC: Technology
  GOOGL: Communication Services
  META: Communication Services
  NFLX: Communication Services
  AMZN: Consumer Discretionary
  TSLA: Consumer Discretionary
  WMT: Consumer Staples
  KO: Consumer Staples
  PG: Consumer Staples
  JPM: Financials
  BAC: Financials
  GS: Financials
  JNJ: Health Care
  UNH: Health Care
  PFE: Health Care
  XOM: Energy
  CVX: Energy
  CAT: Industrials

# --- Data --------------------------------------------------------------------
data:
  start_date: "2016-01-01"      # ~10 years of daily bars
  end_date: null                # null = up to most recent session
  cache_dir: "data/raw"         # parquet cache, survives re-runs offline
  source: "yahoo"

# --- SQLite data warehouse ---------------------------------------------------
database:
  path: "database/market_data.db"

# --- Data cleaning -----------------------------------------------------------
cleaning:
  outlier_sigma: 5.0            # flag returns beyond +/- 5 sigma (kept, flagged)
  min_history_days: 260        # require at least ~1 year of bars

# --- Feature engineering -----------------------------------------------------
features:
  # Prediction target & label sampling: predict the direction of the next
  # `target_horizon` trading days (5 = one trading week), and keep every
  # `sampling_step`-th trading date so consecutive labels do NOT overlap
  # (overlapping labels would inflate cross-validation significance).
  target_horizon: 5
  sampling_step: 5
  return_lags: [1, 5, 10, 21]   # lagged daily returns (trading days)
  sma_windows: [10, 20, 50]     # simple moving average windows
  ema_span: 12
  rsi_period: 14
  macd: { fast: 12, slow: 26, signal: 9 }
  bollinger: { window: 20, num_std: 2.0 }
  volatility_windows: [10, 30]  # annualized realized volatility
  volume_window: 20             # volume z-score window
  high52_window: 252            # 52-week high/low distance
  warmup_days: 60               # rows dropped at series start (indicator burn-in)

# --- Modeling ----------------------------------------------------------------
model:
  test_ratio: 0.20              # chronological hold-out (last 20% of dates)
  cv_folds: 5                   # TimeSeriesSplit folds within the train set
  random_state: 42
  models:
    logistic:
      C: 0.1
    random_forest:
      n_estimators: 400
      max_depth: 6
      min_samples_leaf: 200
      max_features: "sqrt"
    xgboost:
      n_estimators: 400
      max_depth: 4
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 100

# --- Backtest ----------------------------------------------------------------
backtest:
  initial_capital: 100000.0     # USD
  probability_threshold: 0.55   # go long only when P(up) exceeds this level
  transaction_cost_bps: 2.0     # 2 basis points per position change (per side)
  risk_free_rate: 0.02          # annual, for Sharpe ratio

# --- Outputs -----------------------------------------------------------------
outputs:
  figures_dir: "outputs/figures"
  results_path: "outputs/results.json"
  report_path: "outputs/report.html"
